<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Simplified faceless figure wearing a headset beside a chat bubble, representing customer support</title>
  <defs>
    <linearGradient id="cs-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162060" />
      <stop offset="100%" stop-color="#0C1650" />
    </linearGradient>
    <linearGradient id="cs-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FED428" />
      <stop offset="100%" stop-color="#FED428" />
    </linearGradient>
    <filter id="cs-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0C1650" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="backdrop">
    <ellipse cx="200" cy="160" rx="155" ry="115" fill="#FED428" fill-opacity="0.06" />
  </g>

  <g id="ground-shadow">
    <ellipse cx="170" cy="262" rx="46" ry="8" fill="#0C1650" fill-opacity="0.08" />
  </g>

  <g id="figure" filter="url(#cs-shadow)">
    <rect x="140" y="150" width="60" height="106" rx="22" fill="url(#cs-navy)" />
    <rect x="122" y="162" width="18" height="64" rx="9" fill="url(#cs-navy)" />
    <rect x="200" y="162" width="18" height="64" rx="9" fill="url(#cs-navy)" />
    <circle cx="170" cy="120" r="30" fill="#e2e8f0" />
    <rect x="152" y="180" width="28" height="18" rx="5" fill="url(#cs-yellow)" />

    <g id="headset">
      <path
        d="M138 118a32 32 0 0 1 64 0"
        fill="none"
        stroke="#0C1650"
        stroke-opacity="0.75"
        stroke-width="6"
        stroke-linecap="round"
      />
      <rect x="130" y="112" width="12" height="22" rx="6" fill="url(#cs-yellow)" />
      <rect x="198" y="112" width="12" height="22" rx="6" fill="url(#cs-yellow)" />
      <path d="M136 132v10a6 6 0 0 0 6 6h4" fill="none" stroke="#0C1650" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" />
      <circle cx="150" cy="150" r="4" fill="#0C1650" fill-opacity="0.6" />
    </g>
  </g>

  <g id="chat-bubble" filter="url(#cs-shadow)">
    <path
      d="M252 100h74a14 14 0 0 1 14 14v40a14 14 0 0 1-14 14h-46l-18 18v-18h-10a14 14 0 0 1-14-14v-40a14 14 0 0 1 14-14Z"
      fill="url(#cs-navy)"
    />
    <circle cx="272" cy="134" r="6" fill="url(#cs-yellow)" />
    <circle cx="292" cy="134" r="6" fill="url(#cs-yellow)" />
    <circle cx="312" cy="134" r="6" fill="url(#cs-yellow)" />
  </g>
</svg>
