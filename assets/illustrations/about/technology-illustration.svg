<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>App phone mockup with a connectivity network of dots and lines, symbolizing the MR Bike Doctor technology platform</title>
  <defs>
    <linearGradient id="tech-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tech-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="tech-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="tech-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <g id="backdrop">
    <ellipse cx="200" cy="152" rx="185" ry="120" fill="#1e293b" fill-opacity="0.05" />
  </g>

  <g id="network" stroke="#334155" stroke-opacity="0.4" stroke-width="2">
    <line x1="150" y1="90" x2="70" y2="60" />
    <line x1="150" y1="120" x2="55" y2="140" />
    <line x1="150" y1="190" x2="65" y2="225" />
    <line x1="250" y1="90" x2="330" y2="55" />
    <line x1="250" y1="150" x2="345" y2="150" />
    <line x1="250" y1="200" x2="325" y2="230" />
  </g>

  <g id="network-nodes" fill="url(#tech-yellow)">
    <circle cx="70" cy="60" r="6" />
    <circle cx="55" cy="140" r="5" />
    <circle cx="65" cy="225" r="6" />
    <circle cx="330" cy="55" r="6" />
    <circle cx="345" cy="150" r="5" />
    <circle cx="325" cy="230" r="6" />
  </g>

  <g id="signal-pulse">
    <circle cx="345" cy="150" r="5" fill="none" stroke="#facc15" stroke-width="2">
      <animate attributeName="r" values="5;16;5" dur="6s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <g id="phone" filter="url(#tech-shadow)">
    <rect x="150" y="45" width="100" height="210" rx="22" fill="url(#tech-navy)" />
    <rect x="160" y="63" width="80" height="174" rx="6" fill="url(#tech-screen)" />
    <rect x="188" y="52" width="24" height="5" rx="2.5" fill="#0f172a" fill-opacity="0.5" />

    <g id="screen-content">
      <rect x="168" y="73" width="64" height="10" rx="5" fill="#0f172a" fill-opacity="0.12" />
      <circle cx="200" cy="130" r="20" fill="#0f172a" fill-opacity="0.08" />
      <path
        d="M200 118c6.6 0 12 5.4 12 12 0 9-12 20-12 20s-12-11-12-20c0-6.6 5.4-12 12-12Z"
        fill="url(#tech-yellow)"
      />
      <circle cx="200" cy="129.5" r="4" fill="#0f172a" fill-opacity="0.7" />
      <rect x="168" y="192" width="64" height="30" rx="6" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.08" stroke-width="1.5" />
      <rect x="174" y="199" width="34" height="6" rx="3" fill="#0f172a" fill-opacity="0.5" />
      <rect x="174" y="209" width="24" height="5" rx="2.5" fill="#0f172a" fill-opacity="0.25" />
    </g>
  </g>
</svg>
