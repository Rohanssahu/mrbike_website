<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Three simplified, faceless mechanics in navy jumpsuits with yellow chest badges standing together</title>
  <defs>
    <linearGradient id="ti-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ti-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="ti-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <g id="backdrop">
    <ellipse cx="200" cy="180" rx="188" ry="110" fill="#facc15" fill-opacity="0.06" />
  </g>

  <g id="ground-shadows" fill="#0f172a" fill-opacity="0.08">
    <ellipse cx="128" cy="262" rx="34" ry="7" />
    <ellipse cx="200" cy="270" rx="38" ry="8" />
    <ellipse cx="272" cy="262" rx="34" ry="7" />
  </g>

  <g id="figure-left" filter="url(#ti-shadow)">
    <rect x="108" y="150" width="40" height="88" rx="18" fill="url(#ti-navy)" />
    <rect x="98" y="160" width="14" height="52" rx="7" fill="url(#ti-navy)" />
    <rect x="148" y="160" width="14" height="52" rx="7" fill="url(#ti-navy)" />
    <rect x="112" y="222" width="14" height="34" rx="6" fill="#334155" />
    <rect x="134" y="222" width="14" height="34" rx="6" fill="#334155" />
    <circle cx="128" cy="128" r="22" fill="#e2e8f0" />
    <rect x="118" y="170" width="20" height="14" rx="4" fill="url(#ti-yellow)" />
  </g>

  <g id="figure-center" filter="url(#ti-shadow)">
    <rect x="180" y="132" width="44" height="102" rx="19" fill="url(#ti-navy)" />
    <rect x="168" y="144" width="15" height="58" rx="7.5" fill="url(#ti-navy)" />
    <rect x="222" y="144" width="15" height="58" rx="7.5" fill="url(#ti-navy)" />
    <rect x="184" y="222" width="15" height="38" rx="6" fill="#334155" />
    <rect x="206" y="222" width="15" height="38" rx="6" fill="#334155" />
    <circle cx="202" cy="108" r="24" fill="#e2e8f0" />
    <rect x="190" y="156" width="22" height="16" rx="4" fill="url(#ti-yellow)" />
  </g>

  <g id="figure-right" filter="url(#ti-shadow)">
    <rect x="252" y="150" width="40" height="88" rx="18" fill="url(#ti-navy)" />
    <rect x="242" y="160" width="14" height="52" rx="7" fill="url(#ti-navy)" />
    <rect x="292" y="160" width="14" height="52" rx="7" fill="url(#ti-navy)" />
    <rect x="256" y="222" width="14" height="34" rx="6" fill="#334155" />
    <rect x="278" y="222" width="14" height="34" rx="6" fill="#334155" />
    <circle cx="272" cy="128" r="22" fill="#e2e8f0" />
    <rect x="262" y="170" width="20" height="14" rx="4" fill="url(#ti-yellow)" />
  </g>
</svg>
