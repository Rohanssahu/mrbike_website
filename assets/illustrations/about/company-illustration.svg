<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Abstract network of connected service points radiating from a central hub, representing the MR Bike Doctor platform</title>
  <defs>
    <linearGradient id="ci-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162060" />
      <stop offset="100%" stop-color="#0C1650" />
    </linearGradient>
    <linearGradient id="ci-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FED428" />
      <stop offset="100%" stop-color="#FED428" />
    </linearGradient>
    <filter id="ci-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0C1650" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="backdrop">
    <ellipse cx="200" cy="158" rx="186" ry="124" fill="#162060" fill-opacity="0.05" />
  </g>

  <g id="connections" stroke="#1A2870" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6" fill="none">
    <line x1="200" y1="150" x2="92" y2="72" />
    <line x1="200" y1="150" x2="308" y2="72" />
    <line x1="200" y1="150" x2="92" y2="228" />
    <line x1="200" y1="150" x2="308" y2="228" />
  </g>

  <g id="hub" filter="url(#ci-shadow)">
    <rect x="163" y="113" width="74" height="74" rx="20" fill="url(#ci-navy)" />
    <g id="gear">
      <circle cx="200" cy="150" r="17" fill="url(#ci-yellow)" />
      <circle cx="200" cy="150" r="7" fill="#0C1650" fill-opacity="0.85" />
      <rect x="196" y="121" width="8" height="10" rx="2" fill="url(#ci-yellow)" transform="rotate(0 200 150)" />
      <rect x="196" y="121" width="8" height="10" rx="2" fill="url(#ci-yellow)" transform="rotate(60 200 150)" />
      <rect x="196" y="121" width="8" height="10" rx="2" fill="url(#ci-yellow)" transform="rotate(120 200 150)" />
      <rect x="196" y="121" width="8" height="10" rx="2" fill="url(#ci-yellow)" transform="rotate(180 200 150)" />
      <rect x="196" y="121" width="8" height="10" rx="2" fill="url(#ci-yellow)" transform="rotate(240 200 150)" />
      <rect x="196" y="121" width="8" height="10" rx="2" fill="url(#ci-yellow)" transform="rotate(300 200 150)" />
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 200 150"
        to="360 200 150"
        dur="9s"
        repeatCount="indefinite"
      />
    </g>
  </g>

  <g id="node-wheel-top-left" filter="url(#ci-shadow)">
    <circle cx="92" cy="72" r="24" fill="#f1f5f9" stroke="#0C1650" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="92" cy="72" r="11" fill="none" stroke="#0C1650" stroke-opacity="0.55" stroke-width="2.5" />
    <line x1="92" y1="63" x2="92" y2="81" stroke="#0C1650" stroke-opacity="0.4" stroke-width="2" />
    <line x1="83" y1="72" x2="101" y2="72" stroke="#0C1650" stroke-opacity="0.4" stroke-width="2" />
  </g>

  <g id="node-pin-top-right" filter="url(#ci-shadow)">
    <circle cx="308" cy="72" r="24" fill="#f1f5f9" stroke="#0C1650" stroke-opacity="0.15" stroke-width="2" />
    <path
      d="M308 63c4.4 0 8 3.5 8 7.8 0 5.6-8 11.7-8 11.7s-8-6.1-8-11.7c0-4.3 3.6-7.8 8-7.8Z"
      fill="#0C1650"
      fill-opacity="0.75"
    />
    <circle cx="308" cy="70.5" r="2.8" fill="#FED428" />
  </g>

  <g id="node-wrench-bottom-left" filter="url(#ci-shadow)">
    <circle cx="92" cy="228" r="24" fill="#f1f5f9" stroke="#0C1650" stroke-opacity="0.15" stroke-width="2" />
    <g transform="rotate(-40 92 228)">
      <rect x="83" y="225" width="18" height="6" rx="3" fill="#0C1650" fill-opacity="0.75" />
      <circle cx="82" cy="228" r="6" fill="none" stroke="#0C1650" stroke-opacity="0.75" stroke-width="3" />
      <circle cx="102" cy="228" r="4.5" fill="#0C1650" fill-opacity="0.75" />
    </g>
  </g>

  <g id="node-wheel-bottom-right" filter="url(#ci-shadow)">
    <circle cx="308" cy="228" r="24" fill="#f1f5f9" stroke="#0C1650" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="308" cy="228" r="11" fill="none" stroke="#0C1650" stroke-opacity="0.55" stroke-width="2.5" />
    <line x1="308" y1="219" x2="308" y2="237" stroke="#0C1650" stroke-opacity="0.4" stroke-width="2" />
    <line x1="299" y1="228" x2="317" y2="228" stroke="#0C1650" stroke-opacity="0.4" stroke-width="2" />
  </g>
</svg>
