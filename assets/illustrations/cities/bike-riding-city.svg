<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A rider on a bike moving along a generic city street lined with abstract buildings</title>
  <defs>
    <linearGradient id="mbd-bike-riding-city-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="mbd-bike-riding-city-rider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <g id="backdrop">
    <path
      fill="url(#mbd-bike-riding-city-blob)"
      d="M206 24c64 4 124 34 152 90 28 56 10 126-38 164-48 38-118 40-168 8-50-32-80-92-70-150C92 66 138 20 194 24c4 0 8 0 12 0Z"
    />
  </g>

  <g id="buildings">
    <rect x="34" y="90" width="52" height="145" rx="6" fill="#334155" opacity="0.14" />
    <rect x="46" y="106" width="8" height="8" fill="#0f172a" opacity="0.12" />
    <rect x="60" y="106" width="8" height="8" fill="#0f172a" opacity="0.12" />
    <rect x="46" y="124" width="8" height="8" fill="#0f172a" opacity="0.12" />
    <rect x="60" y="124" width="8" height="8" fill="#0f172a" opacity="0.12" />

    <rect x="104" y="58" width="46" height="177" rx="6" fill="#334155" opacity="0.12" />
    <rect x="114" y="76" width="8" height="8" fill="#0f172a" opacity="0.12" />
    <rect x="128" y="76" width="8" height="8" fill="#0f172a" opacity="0.12" />
    <rect x="114" y="94" width="8" height="8" fill="#0f172a" opacity="0.12" />
    <rect x="128" y="94" width="8" height="8" fill="#0f172a" opacity="0.12" />

    <rect x="308" y="98" width="54" height="137" rx="6" fill="#334155" opacity="0.16" />
    <rect x="320" y="114" width="8" height="8" fill="#0f172a" opacity="0.12" />
    <rect x="336" y="114" width="8" height="8" fill="#0f172a" opacity="0.12" />
    <rect x="320" y="132" width="8" height="8" fill="#0f172a" opacity="0.12" />
    <rect x="336" y="132" width="8" height="8" fill="#0f172a" opacity="0.12" />
  </g>

  <g id="road">
    <rect x="0" y="235" width="400" height="45" fill="#334155" opacity="0.08" />
    <line
      x1="20"
      y1="257"
      x2="380"
      y2="257"
      stroke="#0f172a"
      stroke-opacity="0.22"
      stroke-width="3"
      stroke-dasharray="16 12"
    />
  </g>

  <g id="shadow">
    <ellipse cx="210" cy="252" rx="92" ry="10" fill="#0f172a" opacity="0.1" />
  </g>

  <g id="motion-lines">
    <line x1="128" y1="210" x2="150" y2="210" stroke="#0f172a" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round" />
    <line x1="122" y1="222" x2="146" y2="222" stroke="#0f172a" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round" />
    <line x1="132" y1="234" x2="154" y2="234" stroke="#0f172a" stroke-opacity="0.1" stroke-width="3" stroke-linecap="round" />
  </g>

  <g id="frame">
    <path
      d="M170 230 L200 195 L240 180 M200 195 L210 230 M210 230 L250 230"
      fill="none"
      stroke="#0f172a"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <rect x="193" y="188" width="14" height="7" rx="3.5" fill="#0f172a" />
    <path d="M232 180h16" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="210" cy="230" r="5" fill="#0f172a" />
  </g>

  <g id="wheel-rear">
    <circle cx="170" cy="230" r="24" fill="#f8fafc" stroke="#0f172a" stroke-width="4" />
    <path d="M170 208v44M148 230h44M155 215l30 30M155 245l30-30" stroke="#0f172a" stroke-width="2" opacity="0.5" />
  </g>

  <g id="wheel-front">
    <circle cx="250" cy="230" r="24" fill="#f8fafc" stroke="#0f172a" stroke-width="4" />
    <path d="M250 208v44M228 230h44M235 215l30 30M235 245l30-30" stroke="#0f172a" stroke-width="2" opacity="0.5" />
  </g>

  <g id="rider" transform="rotate(-20 205 195)">
    <rect x="196" y="150" width="26" height="55" rx="13" fill="url(#mbd-bike-riding-city-rider)" />
    <rect x="203" y="168" width="14" height="10" rx="3" fill="#facc15" />
    <rect x="200" y="145" width="18" height="10" rx="4" fill="#e2e8f0" />
    <circle cx="209" cy="132" r="16" fill="#e2e8f0" />
  </g>

  <g id="rider-limbs">
    <path d="M216 165 L235 180" stroke="#0f172a" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M203 210 L210 230" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>
</svg>
