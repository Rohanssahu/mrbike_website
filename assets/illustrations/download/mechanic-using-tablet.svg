<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A mechanic in a navy jumpsuit holding a tablet showing a job list</title>
  <defs>
    <linearGradient id="mbd-mechanic-using-tablet-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162060" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0C1650" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="mbd-mechanic-using-tablet-jumpsuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162060" />
      <stop offset="100%" stop-color="#0C1650" />
    </linearGradient>
    <linearGradient id="mbd-mechanic-using-tablet-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="mbd-mechanic-using-tablet-case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162060" />
      <stop offset="100%" stop-color="#0C1650" />
    </linearGradient>
  </defs>

  <g id="backdrop">
    <path
      fill="url(#mbd-mechanic-using-tablet-blob)"
      d="M204 30c62 2 122 34 148 90 26 56 8 126-40 162-48 36-118 38-168 6-50-32-80-92-70-150 10-58 56-104 114-108 5 0 11 0 16 0Z"
    />
  </g>

  <g id="shadow">
    <ellipse cx="200" cy="266" rx="88" ry="12" fill="#0C1650" opacity="0.1" />
  </g>

  <g id="figure">
    <g id="legs">
      <rect x="176" y="218" width="20" height="46" rx="10" fill="#162060" />
      <rect x="206" y="218" width="20" height="46" rx="10" fill="#162060" />
    </g>

    <g id="torso">
      <rect x="160" y="142" width="88" height="90" rx="38" fill="url(#mbd-mechanic-using-tablet-jumpsuit)" />
    </g>

    <g id="chest-badge">
      <rect x="190" y="170" width="28" height="20" rx="7" fill="#FED428" />
      <circle cx="204" cy="180" r="4" fill="#FED428" />
    </g>

    <g id="neck">
      <rect x="192" y="128" width="24" height="18" rx="6" fill="url(#mbd-mechanic-using-tablet-skin)" />
    </g>

    <g id="head">
      <circle cx="204" cy="102" r="34" fill="url(#mbd-mechanic-using-tablet-skin)" />
    </g>

    <g id="arms">
      <path d="M170 162 L182 230" stroke="url(#mbd-mechanic-using-tablet-jumpsuit)" stroke-width="16" stroke-linecap="round" fill="none" />
      <path d="M234 162 L268 230" stroke="url(#mbd-mechanic-using-tablet-jumpsuit)" stroke-width="16" stroke-linecap="round" fill="none" />
      <circle cx="183" cy="230" r="9" fill="url(#mbd-mechanic-using-tablet-skin)" />
      <circle cx="267" cy="230" r="9" fill="url(#mbd-mechanic-using-tablet-skin)" />
    </g>
  </g>

  <g id="tablet">
    <rect x="175" y="125" width="100" height="130" rx="14" fill="url(#mbd-mechanic-using-tablet-case)" />
    <rect x="183" y="133" width="84" height="104" rx="8" fill="#f1f5f9" />
    <rect x="183" y="133" width="84" height="10" rx="5" fill="#0C1650" opacity="0.15" />

    <g id="job-row-done">
      <circle cx="195" cy="152" r="6" fill="#FED428" />
      <path d="M192 152l2 3 5-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="208" y="149" width="50" height="6" rx="3" fill="#0C1650" opacity="0.4" />
    </g>

    <g id="job-row-pending-1">
      <circle cx="195" cy="177" r="6" fill="none" stroke="#0C1650" stroke-width="2" opacity="0.4" />
      <rect x="208" y="174" width="50" height="6" rx="3" fill="#0C1650" opacity="0.25" />
    </g>

    <g id="job-row-pending-2">
      <circle cx="195" cy="202" r="6" fill="none" stroke="#0C1650" stroke-width="2" opacity="0.4" />
      <rect x="208" y="199" width="42" height="6" rx="3" fill="#0C1650" opacity="0.25" />
    </g>
  </g>
</svg>
