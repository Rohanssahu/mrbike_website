<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A smartphone connecting to a bike through pulsing signal waves</title>
  <defs>
    <linearGradient id="mbd-app-ecosystem-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="mbd-app-ecosystem-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <g id="backdrop">
    <path
      fill="url(#mbd-app-ecosystem-blob)"
      d="M204 28c62 4 122 34 150 90 28 56 10 126-38 164-48 38-118 40-168 8-50-32-80-92-70-150 10-58 56-104 112-110 5 0 9-2 14-2Z"
    />
  </g>

  <g id="shadow">
    <ellipse cx="95" cy="216" rx="42" ry="9" fill="#0f172a" opacity="0.1" />
    <ellipse cx="290" cy="252" rx="70" ry="10" fill="#0f172a" opacity="0.1" />
  </g>

  <g id="phone">
    <rect x="60" y="100" width="70" height="120" rx="16" fill="url(#mbd-app-ecosystem-phone)" />
    <rect x="68" y="112" width="54" height="88" rx="8" fill="#f1f5f9" />
    <circle cx="95" cy="146" r="8" fill="#0f172a" />
    <path d="M87 150 L95 165 L103 150 Z" fill="#0f172a" />
    <circle cx="95" cy="146" r="2.5" fill="#facc15" />
    <rect x="80" y="176" width="30" height="4" rx="2" fill="#0f172a" opacity="0.3" />
  </g>

  <g id="signal-waves">
    <path
      d="M150 150a45 45 0 0 1 0 64"
      fill="none"
      stroke="#facc15"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.3"
    >
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="6s" begin="0s" repeatCount="indefinite" />
    </path>
    <path
      d="M164 136a68 68 0 0 1 0 92"
      fill="none"
      stroke="#facc15"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.22"
    >
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" begin="2s" repeatCount="indefinite" />
    </path>
    <path
      d="M178 120a90 90 0 0 1 0 124"
      fill="none"
      stroke="#facc15"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.15"
    >
      <animate attributeName="opacity" values="0.06;0.3;0.06" dur="6s" begin="4s" repeatCount="indefinite" />
    </path>
  </g>

  <g id="pin">
    <circle cx="290" cy="150" r="9" fill="#0f172a" />
    <path d="M281 155 L290 172 L299 155 Z" fill="#0f172a" />
    <circle cx="290" cy="150" r="3" fill="#facc15" />
  </g>

  <g id="frame">
    <path
      d="M250 232 L285 190 L320 176 M285 190 L295 232 M295 232 L340 232"
      fill="none"
      stroke="#0f172a"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <rect x="278" y="180" width="14" height="7" rx="3.5" fill="#0f172a" />
    <path d="M312 176h18" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <g id="wheel-rear">
    <circle cx="250" cy="232" r="22" fill="#f8fafc" stroke="#0f172a" stroke-width="4" />
    <path d="M250 212v40M230 232h40M236 218l28 28M236 246l28-28" stroke="#0f172a" stroke-width="2" opacity="0.5" />
  </g>

  <g id="wheel-front">
    <circle cx="340" cy="232" r="22" fill="#f8fafc" stroke="#0f172a" stroke-width="4" />
    <path d="M340 212v40M320 232h40M326 218l28 28M326 246l28-28" stroke="#0f172a" stroke-width="2" opacity="0.5" />
  </g>
</svg>
