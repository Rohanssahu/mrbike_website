<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A customer holding a smartphone showing a map pin and a service status card</title>
  <defs>
    <linearGradient id="mbd-customer-using-app-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="mbd-customer-using-app-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="mbd-customer-using-app-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="mbd-customer-using-app-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <g id="backdrop">
    <path
      fill="url(#mbd-customer-using-app-blob)"
      d="M202 32c64 2 126 32 154 88 28 56 12 128-36 166-48 38-120 42-172 10-52-32-84-92-74-152C84 84 130 36 190 32c4 0 8 0 12 0Z"
    />
  </g>

  <g id="shadow">
    <ellipse cx="200" cy="270" rx="92" ry="12" fill="#0f172a" opacity="0.1" />
  </g>

  <g id="figure">
    <g id="legs">
      <rect x="182" y="225" width="18" height="45" rx="9" fill="#334155" />
      <rect x="204" y="225" width="18" height="45" rx="9" fill="#334155" />
    </g>

    <g id="torso">
      <rect x="168" y="150" width="68" height="90" rx="30" fill="url(#mbd-customer-using-app-shirt)" />
    </g>

    <g id="neck">
      <rect x="192" y="126" width="20" height="16" rx="5" fill="url(#mbd-customer-using-app-skin)" />
    </g>

    <g id="head">
      <circle cx="202" cy="100" r="28" fill="url(#mbd-customer-using-app-skin)" />
    </g>

    <g id="arms">
      <path d="M172 165 L192 256" stroke="url(#mbd-customer-using-app-shirt)" stroke-width="16" stroke-linecap="round" fill="none" />
      <path d="M232 165 L260 256" stroke="url(#mbd-customer-using-app-shirt)" stroke-width="16" stroke-linecap="round" fill="none" />
      <circle cx="190" cy="258" r="9" fill="url(#mbd-customer-using-app-skin)" />
      <circle cx="260" cy="258" r="9" fill="url(#mbd-customer-using-app-skin)" />
    </g>
  </g>

  <g id="phone">
    <rect x="185" y="130" width="80" height="140" rx="18" fill="url(#mbd-customer-using-app-phone)" />
    <rect x="213" y="138" width="14" height="3" rx="1.5" fill="#0f172a" opacity="0.4" />
    <rect x="193" y="148" width="64" height="112" rx="10" fill="#f1f5f9" />

    <g id="map-lines">
      <path d="M198 168q30 10 50 40" stroke="#0f172a" stroke-opacity="0.12" stroke-width="2" fill="none" />
      <path d="M200 224q25 -8 50 10" stroke="#0f172a" stroke-opacity="0.12" stroke-width="2" fill="none" />
    </g>

    <g id="map-pin">
      <circle cx="225" cy="182" r="9" fill="#0f172a" />
      <path d="M216 187 L225 204 L234 187 Z" fill="#0f172a" />
      <circle cx="225" cy="182" r="3" fill="#facc15" />
    </g>

    <g id="status-card">
      <rect x="200" y="230" width="50" height="24" rx="6" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.15" />
      <circle cx="208" cy="242" r="3" fill="#facc15" />
      <rect x="216" y="237" width="26" height="3" rx="1.5" fill="#0f172a" opacity="0.5" />
      <rect x="216" y="244" width="18" height="3" rx="1.5" fill="#0f172a" opacity="0.3" />
    </g>
  </g>
</svg>
