<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A mechanic in a navy jumpsuit kneeling beside a motorcycle mid-service, tools laid out nearby</title>
  <defs>
    <linearGradient id="hb-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hb-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="hb-blob-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="hb-blob-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.06" />
    </linearGradient>
    <pattern id="hb-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0f172a" fill-opacity="0.12" />
    </pattern>
    <filter id="hb-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <g id="backdrop">
    <path fill="url(#hb-blob-navy)" d="M300 8c48 4 92 34 104 78 12 44-8 96-48 122-40 26-98 26-136-4-38-30-54-84-36-128 18-44 68-72 116-68Z" />
    <path fill="url(#hb-blob-yellow)" d="M74 156c38 3 70 30 78 66 8 36-8 78-42 96-34 18-82 12-108-16-26-28-30-76-8-108 22-32 42-41 80-38Z" />
    <circle cx="80" cy="90" r="60" fill="url(#hb-dots)" opacity="0.6" />
  </g>

  <g id="ground-shadow">
    <ellipse cx="215" cy="252" rx="155" ry="12" fill="#0f172a" opacity="0.14" filter="url(#hb-blur)" />
  </g>

  <g id="tools">
    <g id="tool-bag">
      <path d="M18 232c0-7 5-11 12-11h30c7 0 12 4 12 11v16c0 4-4 7-7 7H25c-4 0-7-3-7-7Z" fill="url(#hb-navy)" />
      <path d="M34 221v-5c0-3.5 3-6.5 6.5-6.5h5c3.5 0 6.5 3 6.5 6.5v5" fill="none" stroke="#334155" stroke-width="3" />
      <rect x="15" y="232" width="60" height="5.5" rx="2.75" fill="#facc15" opacity="0.9" />
    </g>
    <g id="wrench-loose">
      <rect x="0" y="0" width="32" height="7" rx="3.5" fill="url(#hb-yellow)" transform="translate(20 254) rotate(-14)" />
      <circle cx="0" cy="3.5" r="6" fill="none" stroke="#eab308" stroke-width="4" transform="translate(20 254) rotate(-14)" />
    </g>
    <g id="oil-can">
      <rect x="178" y="230" width="17" height="22" rx="4" fill="url(#hb-yellow)" />
      <rect x="0" y="0" width="9" height="7" rx="1.6" fill="#0f172a" transform="translate(172 226) rotate(-22)" />
      <rect x="182" y="225" width="10" height="4" rx="2" fill="#0f172a" />
    </g>
  </g>

  <g id="motorcycle">
    <g id="exhaust">
      <rect x="248" y="0" width="58" height="10" rx="5" fill="#334155" transform="translate(0 205) rotate(4 277 5)" />
    </g>

    <g id="wheel-rear">
      <circle cx="300" cy="216" r="33" fill="url(#hb-navy)" />
      <circle cx="300" cy="216" r="20" fill="none" stroke="#e2e8f0" stroke-width="3" opacity="0.7" />
      <g stroke="#e2e8f0" stroke-width="2" opacity="0.5">
        <line x1="300" y1="197" x2="300" y2="235" />
        <line x1="282" y1="216" x2="318" y2="216" />
        <line x1="287" y1="203" x2="313" y2="229" />
        <line x1="313" y1="203" x2="287" y2="229" />
      </g>
      <circle cx="300" cy="216" r="6" fill="#facc15" />
    </g>

    <g id="wheel-front">
      <circle cx="152" cy="216" r="30" fill="url(#hb-navy)" />
      <circle cx="152" cy="216" r="18" fill="none" stroke="#e2e8f0" stroke-width="3" opacity="0.7" />
      <g stroke="#e2e8f0" stroke-width="2" opacity="0.5">
        <line x1="152" y1="198" x2="152" y2="234" />
        <line x1="134" y1="216" x2="170" y2="216" />
        <line x1="139" y1="203" x2="165" y2="229" />
        <line x1="165" y1="203" x2="139" y2="229" />
      </g>
      <circle cx="152" cy="216" r="5.5" fill="#facc15" />
    </g>

    <g id="rear-strut">
      <rect x="-4.5" y="0" width="9" height="38" rx="4.5" fill="url(#hb-navy)" transform="translate(298 180) rotate(8)" />
    </g>
    <g id="front-fork">
      <rect x="-4.5" y="0" width="9" height="50" rx="4.5" fill="url(#hb-navy)" transform="translate(154 168) rotate(-12)" />
    </g>

    <g id="body">
      <rect x="150" y="152" width="128" height="46" rx="23" fill="url(#hb-navy)" />
      <ellipse cx="196" cy="167" rx="26" ry="9" fill="#e2e8f0" opacity="0.14" />
      <g stroke="#facc15" stroke-width="2" opacity="0.5">
        <line x1="210" y1="186" x2="252" y2="186" />
        <line x1="210" y1="179" x2="252" y2="179" />
      </g>
    </g>
    <g id="seat">
      <rect x="244" y="145" width="46" height="14" rx="7" fill="#1e293b" />
    </g>

    <g id="gear" transform-origin="185 205">
      <animateTransform attributeName="transform" type="rotate" from="0 185 205" to="360 185 205" dur="7s" repeatCount="indefinite" />
      <circle cx="185" cy="205" r="11" fill="none" stroke="url(#hb-yellow)" stroke-width="5.5" stroke-dasharray="4 3.4" />
      <circle cx="185" cy="205" r="4.5" fill="#0f172a" />
      <circle cx="185" cy="205" r="1.4" fill="#facc15" />
    </g>

    <g id="handlebar">
      <rect x="-4" y="0" width="8" height="20" rx="4" fill="#0f172a" transform="translate(150 148) rotate(-6)" />
      <rect x="112" y="140" width="56" height="7" rx="3.5" fill="#0f172a" />
      <circle cx="115" cy="143.5" r="6" fill="#facc15" />
      <circle cx="165" cy="143.5" r="6" fill="#facc15" />
    </g>

    <g id="headlight">
      <circle cx="153" cy="163" r="8.5" fill="#fef9c3" stroke="#0f172a" stroke-width="2" />
    </g>
  </g>

  <g id="mechanic">
    <g id="legs">
      <rect x="-9" y="0" width="18" height="50" rx="9" fill="url(#hb-navy)" transform="translate(88 198) rotate(-6)" />
      <rect x="-9" y="0" width="18" height="54" rx="9" fill="url(#hb-navy)" transform="translate(112 198) rotate(16)" />
      <ellipse cx="66" cy="248" rx="14" ry="7" fill="#0f172a" />
      <ellipse cx="132" cy="252" rx="15" ry="7" fill="#0f172a" />
    </g>

    <g id="torso">
      <rect x="-16" y="-56" width="32" height="58" rx="16" fill="url(#hb-navy)" transform="translate(98 196) rotate(16)" />
      <circle cx="0" cy="-38" r="7.5" fill="#facc15" stroke="#0f172a" stroke-width="1.4" transform="translate(98 196) rotate(16)" />
    </g>

    <g id="arms">
      <rect x="-7" y="0" width="14" height="52" rx="7" fill="#1e293b" transform="translate(112 168) rotate(66)" />
      <circle cx="0" cy="0" r="8" fill="#e2e8f0" transform="translate(163 190)" />
      <rect x="0" y="-3.5" width="26" height="7" rx="3.5" fill="url(#hb-yellow)" transform="translate(163 190) rotate(-18)" />
      <circle cx="24" cy="-3.5" r="5.5" fill="none" stroke="#eab308" stroke-width="3.5" transform="translate(163 190) rotate(-18)" />

      <rect x="-6.5" y="0" width="13" height="30" rx="6.5" fill="#1e293b" transform="translate(78 172) rotate(-32)" />
    </g>

    <g id="head">
      <circle cx="90" cy="140" r="15" fill="#e2e8f0" />
      <path d="M75 136a15 15 0 0 1 30-2c-7-5-23-4-30 2Z" fill="#0f172a" />
    </g>
  </g>
</svg>
