<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A mechanic helping with a bike stopped on the road, with a small alert flag beside it</title>
  <defs>
    <linearGradient id="ra-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ra-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="ra-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.04" />
    </linearGradient>
    <pattern id="ra-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0f172a" fill-opacity="0.12" />
    </pattern>
    <filter id="ra-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <g id="backdrop">
    <path fill="url(#ra-blob)" d="M60 12c44 2 82 32 92 76 10 44-10 92-48 116-38 24-92 18-122-14-30-32-32-84-4-118 24-30 38-62 82-60Z" />
    <circle cx="340" cy="70" r="50" fill="url(#ra-dots)" opacity="0.55" />
  </g>

  <g id="road">
    <rect x="0" y="250" width="400" height="4" fill="#e2e8f0" />
    <g stroke="#cbd5e1" stroke-width="3" stroke-dasharray="16 12">
      <line x1="0" y1="258" x2="400" y2="258" />
    </g>
  </g>

  <g id="ground-shadow">
    <ellipse cx="210" cy="254" rx="140" ry="11" fill="#0f172a" opacity="0.13" filter="url(#ra-blur)" />
  </g>

  <g id="alert-flag">
    <rect x="330" y="150" width="4" height="80" rx="2" fill="#334155" />
    <path d="M334 150 L372 165 L334 180Z" fill="url(#ra-yellow)" />
    <rect x="349" y="159" width="4" height="11" rx="2" fill="#0f172a" />
    <circle cx="351" cy="174" r="2.4" fill="#0f172a" />
  </g>

  <g id="bike">
    <circle cx="175" cy="222" r="30" fill="url(#ra-navy)" />
    <circle cx="175" cy="222" r="18" fill="none" stroke="#e2e8f0" stroke-width="3" opacity="0.7" />
    <g stroke="#e2e8f0" stroke-width="2" opacity="0.5">
      <line x1="175" y1="204" x2="175" y2="240" />
      <line x1="157" y1="222" x2="193" y2="222" />
    </g>
    <circle cx="175" cy="222" r="5.5" fill="#facc15" />

    <circle cx="270" cy="222" r="28" fill="url(#ra-navy)" />
    <circle cx="270" cy="222" r="17" fill="none" stroke="#e2e8f0" stroke-width="3" opacity="0.7" />
    <g stroke="#e2e8f0" stroke-width="2" opacity="0.5">
      <line x1="270" y1="205" x2="270" y2="239" />
      <line x1="253" y1="222" x2="287" y2="222" />
    </g>
    <circle cx="270" cy="222" r="5" fill="#facc15" />

    <rect x="170" y="168" width="110" height="40" rx="20" fill="url(#ra-navy)" />
    <rect x="222" y="160" width="42" height="13" rx="6.5" fill="#1e293b" />
    <rect x="-4" y="0" width="8" height="42" rx="4" fill="url(#ra-navy)" transform="translate(176 182) rotate(-8)" />
    <rect x="-4" y="0" width="8" height="30" rx="4" fill="#0f172a" transform="translate(176 148) rotate(-4)" />
    <rect x="150" y="140" width="50" height="7" rx="3.5" fill="#0f172a" />
    <circle cx="153" cy="143.5" r="6" fill="#facc15" />
    <circle cx="197" cy="143.5" r="6" fill="#facc15" />
    <circle cx="176" cy="178" r="8" fill="#fef9c3" stroke="#0f172a" stroke-width="2" />

    <rect x="-3.5" y="0" width="7" height="46" rx="3.5" fill="#334155" transform="translate(178 218) rotate(28)" />
  </g>

  <g id="mechanic">
    <g id="legs">
      <rect x="-9" y="0" width="18" height="46" rx="9" fill="url(#ra-navy)" transform="translate(84 202) rotate(-8)" />
      <rect x="-9" y="0" width="18" height="52" rx="9" fill="url(#ra-navy)" transform="translate(108 202) rotate(18)" />
      <ellipse cx="64" cy="246" rx="14" ry="7" fill="#0f172a" />
      <ellipse cx="130" cy="250" rx="15" ry="7" fill="#0f172a" />
    </g>

    <g id="torso">
      <rect x="-16" y="-56" width="32" height="58" rx="16" fill="url(#ra-navy)" transform="translate(94 200) rotate(14)" />
      <circle cx="0" cy="-38" r="7" fill="#facc15" stroke="#0f172a" stroke-width="1.4" transform="translate(94 200) rotate(14)" />
    </g>

    <g id="arms">
      <rect x="-7" y="0" width="14" height="48" rx="7" fill="#1e293b" transform="translate(108 174) rotate(58)" />
      <circle cx="0" cy="0" r="7.5" fill="#e2e8f0" transform="translate(146 192)" />
      <rect x="-6.5" y="0" width="13" height="28" rx="6.5" fill="#1e293b" transform="translate(76 178) rotate(-24)" />
    </g>

    <g id="head">
      <circle cx="86" cy="146" r="15" fill="#e2e8f0" />
      <path d="M71 142a15 15 0 0 1 30-2c-7-5-23-4-30 2Z" fill="#0f172a" />
    </g>
  </g>
</svg>
