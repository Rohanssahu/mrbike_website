<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A branded service van transporting a bike for pickup and drop</title>
  <defs>
    <linearGradient id="pd-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162060" />
      <stop offset="100%" stop-color="#0C1650" />
    </linearGradient>
    <linearGradient id="pd-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FED428" />
      <stop offset="100%" stop-color="#FED428" />
    </linearGradient>
    <linearGradient id="pd-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162060" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#0C1650" stop-opacity="0.04" />
    </linearGradient>
    <pattern id="pd-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0C1650" fill-opacity="0.12" />
    </pattern>
    <filter id="pd-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <g id="backdrop">
    <path fill="url(#pd-blob)" d="M300 14c46 4 88 36 98 82 10 46-12 96-52 118-40 22-94 14-124-18-30-32-32-86-4-120 28-34 36-66 82-62Z" />
    <circle cx="70" cy="70" r="58" fill="url(#pd-dots)" opacity="0.55" />
  </g>

  <g id="road">
    <rect x="0" y="248" width="400" height="4" fill="#e2e8f0" />
    <g stroke="#cbd5e1" stroke-width="3" stroke-dasharray="16 12">
      <line x1="0" y1="256" x2="400" y2="256" />
    </g>
  </g>

  <g id="ground-shadow">
    <ellipse cx="230" cy="252" rx="150" ry="11" fill="#0C1650" opacity="0.14" filter="url(#pd-blur)" />
  </g>

  <g id="motion-lines">
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <line x1="30" y1="150" x2="60" y2="150" />
      <line x1="20" y1="170" x2="55" y2="170" />
      <line x1="35" y1="190" x2="58" y2="190" />
    </g>
  </g>

  <g id="van">
    <circle cx="150" cy="238" r="20" fill="url(#pd-navy)" />
    <circle cx="150" cy="238" r="8" fill="#1A2870" />
    <circle cx="300" cy="238" r="20" fill="url(#pd-navy)" />
    <circle cx="300" cy="238" r="8" fill="#1A2870" />

    <path d="M75 150c0-11 9-20 20-20h175c12 0 20 9 20 20v58c0 6-5 11-11 11H86c-6 0-11-5-11-11Z" fill="url(#pd-navy)" />
    <path d="M270 130h20c9 0 20 6 25 18l10 20h-55Z" fill="#162060" />
    <rect x="285" y="150" width="34" height="20" rx="4" fill="#bae6fd" opacity="0.65" />

    <rect x="95" y="140" width="150" height="14" rx="7" fill="#FED428" />
    <circle cx="118" cy="147" r="4.5" fill="#0C1650" />
    <rect x="132" y="143" width="70" height="8" rx="4" fill="#0C1650" opacity="0.85" />

    <rect x="75" y="196" width="240" height="10" fill="#FED428" opacity="0.9" />
  </g>

  <g id="ramp">
    <path d="M40 230 L78 195 L86 202 L48 236Z" fill="#94a3b8" opacity="0.6" />
  </g>

  <g id="cargo-bike">
    <circle cx="55" cy="212" r="16" fill="none" stroke="#0C1650" stroke-width="4.5" />
    <circle cx="55" cy="212" r="16" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.7" />
    <circle cx="55" cy="212" r="3" fill="#FED428" />
    <path d="M55 212 L80 196 L36 188 L55 212Z" fill="none" stroke="#0C1650" stroke-width="4.5" stroke-linejoin="round" />
    <rect x="70" y="180" width="20" height="6" rx="3" fill="#0C1650" />
    <rect x="30" y="185" width="9" height="6" rx="3" fill="#0C1650" />
  </g>
</svg>
