<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Close-up of hands using a wrench and oil can to service a bike engine</title>
  <defs>
    <linearGradient id="bs-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bs-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="bs-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.04" />
    </linearGradient>
    <pattern id="bs-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0f172a" fill-opacity="0.12" />
    </pattern>
    <filter id="bs-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <g id="backdrop">
    <path fill="url(#bs-blob)" d="M330 20c40 6 70 40 74 82 4 42-18 88-56 108-38 20-90 12-118-20-28-32-32-84-8-120 24-36 68-56 108-50Z" />
    <circle cx="60" cy="70" r="56" fill="url(#bs-dots)" opacity="0.6" />
  </g>

  <g id="ground-shadow">
    <ellipse cx="205" cy="255" rx="140" ry="12" fill="#0f172a" opacity="0.12" filter="url(#bs-blur)" />
  </g>

  <g id="chain">
    <g stroke="#334155" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M300 250c-30-4-58-16-78-38" stroke-dasharray="2 12" />
    </g>
  </g>

  <g id="sprocket" transform-origin="300 232">
    <animateTransform attributeName="transform" type="rotate" from="0 300 232" to="360 300 232" dur="9s" repeatCount="indefinite" />
    <circle cx="300" cy="232" r="30" fill="none" stroke="url(#bs-yellow)" stroke-width="11" stroke-dasharray="7 6.5" />
    <circle cx="300" cy="232" r="15" fill="url(#bs-navy)" />
    <circle cx="300" cy="232" r="5" fill="#facc15" />
  </g>

  <g id="engine-block">
    <rect x="90" y="90" width="190" height="120" rx="18" fill="url(#bs-navy)" />
    <g stroke="#facc15" stroke-width="3" opacity="0.45">
      <line x1="106" y1="112" x2="106" y2="188" />
      <line x1="124" y1="108" x2="124" y2="192" />
      <line x1="142" y1="106" x2="142" y2="194" />
    </g>
    <circle cx="215" cy="130" r="16" fill="#334155" />
    <circle cx="215" cy="130" r="7" fill="#0f172a" stroke="#facc15" stroke-width="2" />
    <path d="M215 114 L221 130 L215 146 L209 130 Z" fill="#334155" opacity="0.7" />
  </g>

  <g id="bolt-detail">
    <polygon points="220,168 232,161 244,168 244,182 232,189 220,182" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <circle cx="232" cy="175" r="4" fill="#facc15" />
  </g>

  <g id="oil-can">
    <rect x="30" y="150" width="34" height="46" rx="8" fill="url(#bs-yellow)" />
    <rect x="10" y="140" width="20" height="12" rx="3" fill="#0f172a" transform="rotate(-20 20 146)" />
    <rect x="38" y="140" width="18" height="8" rx="3" fill="#0f172a" />
    <circle cx="14" cy="132" r="3" fill="#facc15" opacity="0.8" />
    <circle cx="8" cy="120" r="2.2" fill="#facc15" opacity="0.6" />
  </g>

  <g id="wrench-hand">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="url(#bs-yellow)" transform="translate(150 210) rotate(-32)" />
    <path d="M0 0a13 13 0 1 0 26 0a13 13 0 1 0-26 0Z" fill="none" stroke="#eab308" stroke-width="7" transform="translate(232 165) rotate(-32)" />

    <g id="hand-back">
      <rect x="0" y="0" width="46" height="30" rx="15" fill="#e2e8f0" transform="translate(150 215) rotate(-18)" />
      <rect x="0" y="0" width="16" height="24" rx="8" fill="#e2e8f0" transform="translate(140 200) rotate(-30)" />
      <rect x="0" y="0" width="16" height="24" rx="8" fill="#e2e8f0" transform="translate(155 195) rotate(-18)" />
      <rect x="0" y="0" width="16" height="22" rx="8" fill="#e2e8f0" transform="translate(170 197) rotate(-8)" />
    </g>

    <g id="sleeve">
      <rect x="0" y="0" width="70" height="40" rx="18" fill="url(#bs-navy)" transform="translate(96 232) rotate(-14)" />
    </g>
  </g>
</svg>
