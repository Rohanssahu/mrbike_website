<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A mechanic arriving at a home gate carrying a tool bag, with a bike parked nearby</title>
  <defs>
    <linearGradient id="dm-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dm-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="dm-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="dm-blob-y" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.06" />
    </linearGradient>
    <pattern id="dm-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0f172a" fill-opacity="0.12" />
    </pattern>
    <filter id="dm-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <g id="backdrop">
    <path fill="url(#dm-blob)" d="M320 10c46 6 82 40 88 84 6 44-20 90-60 108-40 18-92 6-118-26-26-32-26-84 2-118 28-34 42-54 88-48Z" />
    <path fill="url(#dm-blob-y)" d="M60 170c34 2 62 26 70 58 8 32-6 70-36 86-30 16-72 10-94-14-22-24-24-66-4-92 20-26 30-40 64-38Z" />
    <circle cx="340" cy="80" r="16" fill="url(#dm-dots)" opacity="0.5" />
  </g>

  <g id="ground-shadow">
    <ellipse cx="200" cy="256" rx="150" ry="12" fill="#0f172a" opacity="0.12" filter="url(#dm-blur)" />
  </g>

  <g id="gate">
    <rect x="270" y="80" width="14" height="150" rx="4" fill="url(#dm-navy)" />
    <rect x="270" y="70" width="14" height="14" rx="4" fill="#facc15" />
    <path d="M284 120c30-14 66-14 96 4v18c-30-16-66-16-96-4Z" fill="#334155" opacity="0.7" />
    <path d="M284 150c30-14 66-14 96 4v18c-30-16-66-16-96-4Z" fill="#334155" opacity="0.7" />
    <rect x="370" y="70" width="14" height="160" rx="4" fill="url(#dm-navy)" />
    <path d="M330 60c14-18 40-18 54 0 4 6-4 12-10 8-10-8-24-8-34 0-6 4-14-2-10-8Z" fill="#1e293b" opacity="0.8" />
  </g>

  <g id="parked-bike">
    <circle cx="235" cy="228" r="20" fill="url(#dm-navy)" />
    <circle cx="235" cy="228" r="12" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.7" />
    <circle cx="235" cy="228" r="3.5" fill="#facc15" />
    <circle cx="315" cy="228" r="21" fill="url(#dm-navy)" />
    <circle cx="315" cy="228" r="12.5" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.7" />
    <circle cx="315" cy="228" r="3.5" fill="#facc15" />
    <rect x="230" y="176" width="86" height="30" rx="15" fill="url(#dm-navy)" />
    <rect x="290" y="168" width="30" height="10" rx="5" fill="#1e293b" />
    <rect x="-3.5" y="0" width="7" height="34" rx="3.5" fill="url(#dm-navy)" transform="translate(236 195) rotate(-10)" />
    <rect x="-3.5" y="0" width="7" height="12" rx="3.5" fill="#334155" transform="translate(255 226) rotate(28)" />
  </g>

  <g id="mechanic">
    <g id="legs">
      <rect x="-9" y="0" width="18" height="66" rx="9" fill="url(#dm-navy)" transform="translate(108 190) rotate(-10)" />
      <rect x="-9" y="0" width="18" height="66" rx="9" fill="url(#dm-navy)" transform="translate(122 190) rotate(12)" />
      <ellipse cx="86" cy="252" rx="15" ry="7" fill="#0f172a" />
      <ellipse cx="148" cy="252" rx="15" ry="7" fill="#0f172a" />
    </g>

    <g id="torso">
      <rect x="-20" y="-70" width="40" height="76" rx="18" fill="url(#dm-navy)" transform="translate(115 188)" />
      <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#facc15" stroke="#0f172a" stroke-width="1.4" transform="translate(115 152)" />
    </g>

    <g id="arms">
      <rect x="-7.5" y="0" width="15" height="58" rx="7.5" fill="#1e293b" transform="translate(96 130) rotate(6)" />
      <rect x="-7.5" y="0" width="15" height="50" rx="7.5" fill="#1e293b" transform="translate(134 128) rotate(-18)" />
      <circle cx="0" cy="0" r="8.5" fill="#e2e8f0" transform="translate(102 186)" />
    </g>

    <g id="tool-bag">
      <path d="M60 196c0-8 6-13 14-13h20c8 0 14 5 14 13v30c0 5-4 9-9 9H69c-5 0-9-4-9-9Z" fill="url(#dm-yellow)" />
      <path d="M72 183v-6c0-4 3.5-7.5 8-7.5h4c4.5 0 8 3.5 8 7.5v6" fill="none" stroke="#0f172a" stroke-width="3" />
      <rect x="58" y="208" width="52" height="6" rx="3" fill="#0f172a" opacity="0.85" />
    </g>

    <g id="head">
      <circle cx="118" cy="108" r="16" fill="#e2e8f0" />
      <path d="M102 104a16 16 0 0 1 32-2c-8-6-24-4-32 2Z" fill="#0f172a" />
    </g>
  </g>
</svg>
