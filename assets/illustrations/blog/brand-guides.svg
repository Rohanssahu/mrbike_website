<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Bike model badge with a hanging tag, representing brand-specific guides</title>
  <defs>
    <linearGradient id="bg-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bg-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="bg-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="backdrop">
    <ellipse cx="200" cy="150" rx="150" ry="118" fill="#facc15" fill-opacity="0.06" />
  </g>

  <g id="badge" filter="url(#bg-shadow)">
    <path
      d="M200 55l70 28v58c0 46-30 79-70 89-40-10-70-43-70-89V83l70-28Z"
      fill="url(#bg-navy)"
    />
    <path
      d="M200 75l52 21v46c0 35-22 59-52 67-30-8-52-32-52-67V96l52-21Z"
      fill="none"
      stroke="#facc15"
      stroke-opacity="0.5"
      stroke-width="2"
    />
    <circle cx="200" cy="150" r="26" fill="none" stroke="url(#bg-yellow)" stroke-width="6" />
    <line x1="200" y1="132" x2="200" y2="168" stroke="url(#bg-yellow)" stroke-width="4" stroke-linecap="round" />
    <line x1="182" y1="150" x2="218" y2="150" stroke="url(#bg-yellow)" stroke-width="4" stroke-linecap="round" />
  </g>

  <g id="tag" filter="url(#bg-shadow)">
    <line x1="288" y1="112" x2="308" y2="140" stroke="#334155" stroke-opacity="0.5" stroke-width="2" />
    <path
      d="M300 130h48a8 8 0 0 1 8 8v34a8 8 0 0 1-8 8h-48a8 8 0 0 1-6-3l-16-24 16-20a8 8 0 0 1 6-3Z"
      fill="url(#bg-yellow)"
    />
    <circle cx="298" cy="151" r="5" fill="#0f172a" fill-opacity="0.7" />
  </g>
</svg>
