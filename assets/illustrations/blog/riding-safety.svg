<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Helmet with a checkmark badge, representing riding safety</title>
  <defs>
    <linearGradient id="rs-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rs-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="rs-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="backdrop">
    <ellipse cx="200" cy="150" rx="150" ry="118" fill="#1e293b" fill-opacity="0.05" />
  </g>

  <g id="helmet" filter="url(#rs-shadow)">
    <path
      d="M130 190c0-56 31.3-100 70-100s70 44 70 100v10H130v-10Z"
      fill="url(#rs-navy)"
    />
    <rect x="118" y="190" width="164" height="24" rx="12" fill="url(#rs-navy)" />
    <path d="M150 150c14-24 36-34 50-34s36 10 50 34" fill="none" stroke="url(#rs-yellow)" stroke-width="8" stroke-linecap="round" />
    <g id="vents" fill="#0f172a" fill-opacity="0.35">
      <rect x="160" y="168" width="12" height="18" rx="4" />
      <rect x="194" y="160" width="12" height="26" rx="4" />
      <rect x="228" y="168" width="12" height="18" rx="4" />
    </g>
  </g>

  <g id="check-badge" filter="url(#rs-shadow)">
    <circle cx="288" cy="196" r="30" fill="url(#rs-yellow)" />
    <path
      d="M275 196l9 9 18-19"
      fill="none"
      stroke="#0f172a"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
