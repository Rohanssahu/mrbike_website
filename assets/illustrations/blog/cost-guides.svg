<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Price tag beside a receipt with line items, representing cost guides</title>
  <defs>
    <linearGradient id="cog-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162060" />
      <stop offset="100%" stop-color="#0C1650" />
    </linearGradient>
    <linearGradient id="cog-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FED428" />
      <stop offset="100%" stop-color="#FED428" />
    </linearGradient>
    <filter id="cog-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0C1650" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="backdrop">
    <ellipse cx="200" cy="150" rx="150" ry="118" fill="#162060" fill-opacity="0.05" />
  </g>

  <g id="receipt" filter="url(#cog-shadow)">
    <path
      d="M150 70h100v170l-10-8-10 8-10-8-10 8-10-8-10 8-10-8-10 8-10-8-10 8V70Z"
      fill="#ffffff"
      stroke="#0C1650"
      stroke-opacity="0.08"
      stroke-width="2"
    />
    <rect x="166" y="90" width="68" height="8" rx="4" fill="#0C1650" fill-opacity="0.12" />
    <rect x="166" y="112" width="50" height="6" rx="3" fill="#0C1650" fill-opacity="0.25" />
    <rect x="166" y="128" width="58" height="6" rx="3" fill="#0C1650" fill-opacity="0.25" />
    <rect x="166" y="144" width="42" height="6" rx="3" fill="#0C1650" fill-opacity="0.25" />
    <line x1="166" y1="164" x2="234" y2="164" stroke="#0C1650" stroke-opacity="0.15" stroke-width="2" />
    <rect x="166" y="176" width="68" height="9" rx="4" fill="url(#cog-navy)" />
  </g>

  <g id="price-tag" filter="url(#cog-shadow)">
    <line x1="252" y1="118" x2="272" y2="146" stroke="#1A2870" stroke-opacity="0.5" stroke-width="2" />
    <path
      d="M264 136h50a8 8 0 0 1 8 8v40a8 8 0 0 1-8 8h-50a8 8 0 0 1-6-3l-18-25 18-25a8 8 0 0 1 6-3Z"
      fill="url(#cog-yellow)"
    />
    <circle cx="262" cy="161" r="5.5" fill="#0C1650" fill-opacity="0.7" />
  </g>
</svg>
