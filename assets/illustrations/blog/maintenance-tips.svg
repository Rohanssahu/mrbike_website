<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Wrench resting on a checklist card, representing maintenance tips</title>
  <defs>
    <linearGradient id="mt-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162060" />
      <stop offset="100%" stop-color="#0C1650" />
    </linearGradient>
    <linearGradient id="mt-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FED428" />
      <stop offset="100%" stop-color="#FED428" />
    </linearGradient>
    <filter id="mt-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0C1650" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="backdrop">
    <ellipse cx="200" cy="150" rx="150" ry="118" fill="#162060" fill-opacity="0.05" />
  </g>

  <g id="checklist-card" filter="url(#mt-shadow)">
    <rect x="140" y="70" width="130" height="170" rx="12" fill="#ffffff" stroke="#0C1650" stroke-opacity="0.08" stroke-width="2" />
    <rect x="180" y="60" width="50" height="18" rx="6" fill="url(#mt-navy)" />
    <g id="checklist-rows" stroke-linecap="round">
      <circle cx="160" cy="112" r="7" fill="none" stroke="#0C1650" stroke-opacity="0.5" stroke-width="2.5" />
      <path d="M157 112l2.5 3 5-6" fill="none" stroke="url(#mt-yellow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="176" y="108" width="70" height="8" rx="4" fill="#0C1650" fill-opacity="0.12" />

      <circle cx="160" cy="146" r="7" fill="none" stroke="#0C1650" stroke-opacity="0.5" stroke-width="2.5" />
      <path d="M157 146l2.5 3 5-6" fill="none" stroke="url(#mt-yellow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="176" y="142" width="70" height="8" rx="4" fill="#0C1650" fill-opacity="0.12" />

      <circle cx="160" cy="180" r="7" fill="none" stroke="#0C1650" stroke-opacity="0.3" stroke-width="2.5" />
      <rect x="176" y="176" width="55" height="8" rx="4" fill="#0C1650" fill-opacity="0.08" />

      <circle cx="160" cy="214" r="7" fill="none" stroke="#0C1650" stroke-opacity="0.3" stroke-width="2.5" />
      <rect x="176" y="210" width="60" height="8" rx="4" fill="#0C1650" fill-opacity="0.08" />
    </g>
  </g>

  <g id="wrench" filter="url(#mt-shadow)" transform="rotate(-32 268 150)">
    <rect x="248" y="120" width="20" height="76" rx="8" fill="url(#mt-yellow)" />
    <circle cx="258" cy="110" r="18" fill="none" stroke="url(#mt-yellow)" stroke-width="10" />
    <circle cx="258" cy="204" r="13" fill="url(#mt-yellow)" />
  </g>
</svg>
