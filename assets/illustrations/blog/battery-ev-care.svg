<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Battery with a charging bolt, representing battery and EV care</title>
  <defs>
    <linearGradient id="bec-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162060" />
      <stop offset="100%" stop-color="#0C1650" />
    </linearGradient>
    <linearGradient id="bec-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FED428" />
      <stop offset="100%" stop-color="#FED428" />
    </linearGradient>
    <filter id="bec-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0C1650" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="backdrop">
    <ellipse cx="200" cy="150" rx="150" ry="118" fill="#FED428" fill-opacity="0.07" />
  </g>

  <g id="battery" filter="url(#bec-shadow)">
    <rect x="130" y="90" width="24" height="18" rx="4" fill="url(#bec-navy)" />
    <rect x="120" y="105" width="160" height="120" rx="18" fill="url(#bec-navy)" />
    <rect x="140" y="125" width="120" height="80" rx="8" fill="#f1f5f9" />
    <g id="battery-cells" fill="url(#bec-yellow)">
      <rect x="150" y="137" width="24" height="56" rx="4" />
      <rect x="184" y="137" width="24" height="56" rx="4">
        <animate attributeName="opacity" values="1;0.35;1" dur="7s" repeatCount="indefinite" />
      </rect>
      <rect x="218" y="137" width="24" height="56" rx="4" fill-opacity="0.25" />
    </g>
  </g>

  <g id="bolt" filter="url(#bec-shadow)">
    <path
      d="M212 118l-34 46h22l-10 40 42-52h-22Z"
      fill="url(#bec-yellow)"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linejoin="round"
    >
      <animate attributeName="opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
