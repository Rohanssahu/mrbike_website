<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>An envelope and a smartphone with a message bubble, representing ways to get in touch</title>
  <defs>
    <linearGradient id="mbd-contact-illustration-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="mbd-contact-illustration-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mbd-contact-illustration-envelope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <g id="backdrop">
    <path
      fill="url(#mbd-contact-illustration-blob)"
      d="M200 36c66 0 132 30 160 88 28 56 12 128-34 168-46 40-118 46-172 20-54-26-92-84-88-146 4-62 46-118 108-134 8-2 17-4 26-4Z"
    />
  </g>

  <g id="shadow">
    <ellipse cx="205" cy="252" rx="112" ry="14" fill="#0f172a" opacity="0.1" />
  </g>

  <g id="envelope">
    <rect x="96" y="112" width="190" height="128" rx="14" fill="url(#mbd-contact-illustration-envelope)" />
    <path
      d="M100 122 191 196 282 122"
      fill="none"
      stroke="#0f172a"
      stroke-opacity="0.35"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="258" cy="132" r="12" fill="#facc15" />
    <circle cx="258" cy="132" r="12" fill="none" stroke="#eab308" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <g id="phone">
    <rect x="238" y="76" width="76" height="140" rx="18" fill="url(#mbd-contact-illustration-phone)" />
    <rect x="246" y="90" width="60" height="104" rx="8" fill="#f1f5f9" />
    <rect x="264" y="112" width="24" height="4" rx="2" fill="#0f172a" opacity="0.5" />
    <rect x="256" y="126" width="40" height="4" rx="2" fill="#0f172a" opacity="0.3" />
    <rect x="256" y="136" width="30" height="4" rx="2" fill="#0f172a" opacity="0.3" />
  </g>

  <g id="chat-bubble">
    <path
      d="M120 70h64a14 14 0 0 1 14 14v20a14 14 0 0 1-14 14h-40l-16 14v-14h-8a14 14 0 0 1-14-14V84a14 14 0 0 1 14-14Z"
      fill="#facc15"
    />
    <circle cx="140" cy="97" r="4" fill="#0f172a" opacity="0.55" />
    <circle cx="154" cy="97" r="4" fill="#0f172a" opacity="0.55" />
    <circle cx="168" cy="97" r="4" fill="#0f172a" opacity="0.55" />
  </g>
</svg>
