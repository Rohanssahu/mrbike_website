<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A small workshop with a tool wall and a bike resting on a service stand</title>
  <defs>
    <linearGradient id="mbd-workshop-illustration-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.04" />
    </linearGradient>
    <pattern id="mbd-workshop-illustration-pegboard" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.6" fill="#0f172a" fill-opacity="0.15" />
    </pattern>
  </defs>

  <g id="backdrop">
    <path
      fill="url(#mbd-workshop-illustration-blob)"
      d="M210 20c64 4 126 34 154 92 28 58 10 130-38 168-48 38-120 40-172 6-52-34-82-96-70-156C96 70 140 24 198 20c4 0 8 0 12 0Z"
    />
  </g>

  <g id="wall">
    <rect x="40" y="26" width="320" height="164" rx="20" fill="#f1f5f9" />
    <rect x="40" y="26" width="320" height="164" rx="20" fill="url(#mbd-workshop-illustration-pegboard)" />
  </g>

  <g id="floor">
    <line x1="40" y1="230" x2="360" y2="230" stroke="#0f172a" stroke-opacity="0.15" stroke-width="2" />
  </g>

  <g id="shadow">
    <ellipse cx="235" cy="272" rx="92" ry="10" fill="#0f172a" opacity="0.1" />
  </g>

  <g id="tools">
    <g id="wrench-tool">
      <line x1="100" y1="55" x2="100" y2="68" stroke="#0f172a" stroke-width="2" opacity="0.4" />
      <circle cx="100" cy="55" r="3" fill="#0f172a" opacity="0.4" />
      <circle cx="100" cy="76" r="11" fill="none" stroke="#0f172a" stroke-width="5" />
      <rect x="94" y="86" width="12" height="48" rx="6" fill="#0f172a" />
    </g>
    <g id="screwdriver-tool">
      <line x1="140" y1="52" x2="140" y2="60" stroke="#0f172a" stroke-width="2" opacity="0.4" />
      <circle cx="140" cy="52" r="3" fill="#0f172a" opacity="0.4" />
      <rect x="134" y="60" width="12" height="30" rx="6" fill="#facc15" />
      <rect x="137" y="88" width="6" height="32" fill="#0f172a" opacity="0.8" />
    </g>
  </g>

  <g id="gear-mount" transform="translate(305 68)">
    <circle r="4" fill="#0f172a" opacity="0.35" />
    <g id="gear">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite" />
      <circle r="20" fill="#facc15" />
      <g id="gear-teeth-cardinal">
        <rect x="-3" y="-27" width="6" height="10" fill="#facc15" />
        <rect x="-3" y="17" width="6" height="10" fill="#facc15" />
        <rect x="-27" y="-3" width="10" height="6" fill="#facc15" />
        <rect x="17" y="-3" width="10" height="6" fill="#facc15" />
      </g>
      <g id="gear-teeth-diagonal" transform="rotate(45)">
        <rect x="-3" y="-27" width="6" height="10" fill="#facc15" />
        <rect x="-3" y="17" width="6" height="10" fill="#facc15" />
        <rect x="-27" y="-3" width="10" height="6" fill="#facc15" />
        <rect x="17" y="-3" width="10" height="6" fill="#facc15" />
      </g>
      <circle r="7" fill="#0f172a" />
    </g>
  </g>

  <g id="bike-stand">
    <rect x="230" y="200" width="6" height="70" fill="#0f172a" />
    <ellipse cx="233" cy="272" rx="18" ry="6" fill="#0f172a" opacity="0.8" />
  </g>

  <g id="frame">
    <path
      d="M190 230 L225 172 L270 150 M225 172 L235 230 M235 230 L290 230"
      fill="none"
      stroke="#0f172a"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <rect x="218" y="160" width="16" height="8" rx="4" fill="#0f172a" />
    <path d="M258 150h24" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <g id="wheel-rear">
    <circle cx="190" cy="230" r="26" fill="#f8fafc" stroke="#0f172a" stroke-width="4" />
    <path
      d="M190 206v48M166 230h48M173 213l34 34M173 247l34-34"
      stroke="#0f172a"
      stroke-width="2"
      opacity="0.5"
    />
  </g>

  <g id="wheel-front">
    <circle cx="290" cy="230" r="26" fill="#f8fafc" stroke="#0f172a" stroke-width="4" />
    <path
      d="M290 206v48M266 230h48M273 213l34 34M273 247l34-34"
      stroke="#0f172a"
      stroke-width="2"
      opacity="0.5"
    />
  </g>
</svg>
