<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A friendly geometric support agent wearing a headset, ready to help</title>
  <defs>
    <linearGradient id="mbd-support-agent-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="mbd-support-agent-jumpsuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mbd-support-agent-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <g id="backdrop">
    <path
      fill="url(#mbd-support-agent-blob)"
      d="M204 30c62 2 122 34 148 90 26 56 8 126-40 162-48 36-118 38-168 6-50-32-80-92-70-150 10-58 56-104 114-108 5 0 11 0 16 0Z"
    />
  </g>

  <g id="shadow">
    <ellipse cx="200" cy="266" rx="82" ry="12" fill="#0f172a" opacity="0.1" />
  </g>

  <g id="figure">
    <g id="legs">
      <rect x="176" y="216" width="20" height="46" rx="10" fill="#1e293b" />
      <rect x="206" y="216" width="20" height="46" rx="10" fill="#1e293b" />
    </g>

    <g id="arm-resting">
      <rect x="150" y="150" width="18" height="56" rx="9" fill="url(#mbd-support-agent-jumpsuit)" />
      <circle cx="159" cy="206" r="9" fill="url(#mbd-support-agent-skin)" />
    </g>

    <g id="torso">
      <rect x="160" y="140" width="88" height="90" rx="38" fill="url(#mbd-support-agent-jumpsuit)" />
    </g>

    <g id="chest-badge">
      <rect x="190" y="168" width="28" height="20" rx="7" fill="#facc15" />
      <circle cx="204" cy="178" r="4" fill="#eab308" />
    </g>

    <g id="arm-waving" transform="rotate(-125 247 150)">
      <rect x="238" y="150" width="18" height="58" rx="9" fill="url(#mbd-support-agent-jumpsuit)" />
      <circle cx="247" cy="208" r="10" fill="url(#mbd-support-agent-skin)" />
    </g>

    <g id="neck">
      <rect x="192" y="126" width="24" height="18" rx="6" fill="url(#mbd-support-agent-skin)" />
    </g>

    <g id="head">
      <circle cx="204" cy="100" r="34" fill="url(#mbd-support-agent-skin)" />
    </g>

    <g id="headset">
      <path
        d="M170 100a34 40 0 0 1 66 0"
        fill="none"
        stroke="#0f172a"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.85"
      />
      <circle cx="170" cy="100" r="11" fill="#0f172a" />
      <circle cx="236" cy="100" r="11" fill="#0f172a" />
      <path
        d="M236 108c-6 22-20 32-40 30"
        fill="none"
        stroke="#0f172a"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.85"
      />
      <circle cx="196" cy="138" r="5" fill="#facc15" />
    </g>
  </g>
</svg>
